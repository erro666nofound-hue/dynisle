# Raw ASCII output for dynisle's Cava service. Grounded in end4-pC's
# scripts/cava/raw_output_config.txt, which is a known-working setup on this
# machine - only the bar count and framerate differ.
[general]
mode = waves
# 56 bars = 14 per side of the album art, which is what the border needs.
bars = 56
framerate = 30
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
# Values arrive as 0..1000, semicolon separated, one frame per line.
ascii_max_range = 1000
channels = mono
mono_option = average

[smoothing]
noise_reduction = 20

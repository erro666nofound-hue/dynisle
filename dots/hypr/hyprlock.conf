# dynisle lock screen (2026-09-03). Designed on the web first:
# https://claude.ai/code/artifact/52e1a456-ab57-4440-b31a-ec5f7606d726
#
# Type on a blurred wallpaper: background, label and input-field only.
#
# Colours come from matugen, which already writes this file on every wallpaper
# change - so the lock screen follows the wallpaper exactly as the bar does.
source = ~/.config/hypr/hyprlock/colors.conf

# Sizes. hyprlock draws in REAL pixels and ignores the monitor's scale, so on a
# sharper screen everything here came out small (2026-10-03). These are the
# sizes at scale 1; dynisle's fix.sh writes hyprlock/scale.conf with them
# multiplied by this machine's scale, and it overrides them below. If that
# file is missing, hyprlock logs one error and uses these - it still locks.
$lock_clock_size = 96
$lock_clock_pos = 0, 130
$lock_date_size = 16
$lock_date_pos = 0, 52
$lock_field_size = 340, 58
$lock_field_round = 29
$lock_field_pos = 0, -70
source = ~/.config/hypr/hyprlock/scale.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The wallpaper, blurred until it is texture rather than picture. matugen has
# been generating $background_image all along; the old config never used it and
# painted a flat #181818 instead.
# ZERO GPU WORK. hyprlock is started by hypridle's `before_sleep_cmd`, i.e.
# INSIDE the suspend window, and asking it to blur a 1672x941 image 4 passes
# there wedged the machine: screen frozen with the lock half-drawn, sound card
# looping its last buffer. `scripts/lock-wallpaper` bakes the blur, the
# darkening and the noise into this file when the WALLPAPER changes, which is a
# moment with nothing at stake. Here it is just a flat blit.
background {
    monitor =
    path = ~/.cache/dynisle/lock.png
    blur_passes = 0
    noise = 0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0
    vibrancy_darkness = 0
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = $lock_clock_size
    font_family = $font_family_clock

    position = $lock_clock_pos
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $text_color
    font_size = $lock_date_size
    font_family = $font_family

    position = $lock_date_pos
    halign = center
    valign = center
}

# NO OUTLINE, and a box darker than what is behind it. The whole background is
# already blurred, so a dark translucent fill reads as a blurred pane rather
# than a flat rectangle - hyprlock cannot blur a widget on its own.
input-field {
    monitor =
    size = $lock_field_size
    rounding = $lock_field_round
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(0000004D)
    font_color = $entry_color

    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false

    placeholder_text = <span foreground="##8a9296">Password</span>
    hide_input = false

    # Its own states, replacing two labels that called scripts which do not
    # exist on this machine.
    check_color = rgba(ffffff44)
    fail_color = rgba(ff6b6b66)
    fail_text = <i>$FAIL · $ATTEMPTS</i>
    capslock_color = rgba(e8c08a66)

    position = $lock_field_pos
    halign = center
    valign = center
}

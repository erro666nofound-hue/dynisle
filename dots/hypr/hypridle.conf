# Lock, then sleep. dynisle takes no part in any of it (2026-09-29).
#
# `pidof hyprlock ||` so there is only ever one lock screen. The end4-pC line
# this replaced dispatched a global that exists only in end4's shell and then
# skipped its own fallback, so nothing on this machine locked at all.
#
# `--immediate-render` so hyprlock does not wait on resources: it is started by
# `before_sleep_cmd`, i.e. INSIDE the suspend window, and anything slow there
# can wedge the machine. That is also why hyprlock.conf draws a pre-blurred
# image (~/.cache/dynisle/lock.png) instead of blurring on the GPU.
$lock_cmd = pidof hyprlock || hyprlock --immediate-render
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}

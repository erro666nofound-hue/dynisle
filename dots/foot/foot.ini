# Colours come from matugen, regenerated on every wallpaper change. `include`
# has to sit here, above every section, because foot only accepts it at the top
# level.
include=~/.config/foot/colors.ini

shell=fish
term=xterm-256color

title=foot

font=JetBrainsMono Nerd Font:size=11
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

[colors-dark]
# foot defaults to alpha=1.0, and at 1.0 it declares its whole surface OPAQUE to
# the compositor. Hyprland then skips blurring behind it, and its own
# active_opacity (0.85) made foot see-through with UNBLURRED content underneath.
# Same quirk kitty has. 0.95 is just enough to drop the opaque declaration -
# Hyprland's global opacity still does the visible work, so foot needs no
# per-app window rule.
alpha=0.95

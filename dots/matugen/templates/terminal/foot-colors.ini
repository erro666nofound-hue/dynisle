# Generated by matugen from the current wallpaper. Do not edit.
#
# foot.ini had a `[colors]` section holding nothing but `alpha`, so the terminal
# kept foot's built-in palette and never followed the wallpaper the way kitty
# and the shell do. `[colors-dark]`, not `[colors]`: foot deprecated the latter
# and says so on every start.
#
# foot wants colours as bare RRGGBB with no leading #.
[colors-dark]
background={{colors.background.default.hex_stripped}}
foreground={{colors.on_background.default.hex_stripped}}

selection-background={{colors.primary_container.default.hex_stripped}}
selection-foreground={{colors.on_primary_container.default.hex_stripped}}

regular0={{colors.surface_container_highest.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.tertiary.default.hex_stripped}}
regular3={{colors.secondary.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{colors.tertiary_fixed_dim.default.hex_stripped}}
regular6={{colors.primary_fixed_dim.default.hex_stripped}}
regular7={{colors.on_surface_variant.default.hex_stripped}}

bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.error.default.hex_stripped}}
bright2={{colors.tertiary.default.hex_stripped}}
bright3={{colors.secondary.default.hex_stripped}}
bright4={{colors.primary.default.hex_stripped}}
bright5={{colors.tertiary_fixed_dim.default.hex_stripped}}
bright6={{colors.primary_fixed_dim.default.hex_stripped}}
bright7={{colors.on_surface.default.hex_stripped}}

# Generated by matugen from the current wallpaper. Do not edit.
#
# kitty.conf already had an `include` pointing here - the file just was not
# being regenerated by anything, so the terminal kept the palette it was given
# back in September and never followed the wallpaper.

background            {{colors.background.default.hex}}
foreground            {{colors.on_background.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

selection_background  {{colors.primary_container.default.hex}}
selection_foreground  {{colors.on_primary_container.default.hex}}

url_color             {{colors.primary.default.hex}}

# The sixteen ANSI slots. Normal and bright are the same hue with the bright
# half taken from the container colours, so bold text lifts off the background
# instead of turning into a second palette that clashes with the first.
color0                {{colors.surface_container_low.default.hex}}
color8                {{colors.surface_container_high.default.hex}}

color1                {{colors.error.default.hex}}
color9                {{colors.on_error_container.default.hex}}

color2                {{colors.tertiary.default.hex}}
color10               {{colors.on_tertiary_container.default.hex}}

color3                {{colors.secondary.default.hex}}
color11               {{colors.on_secondary_container.default.hex}}

color4                {{colors.primary.default.hex}}
color12               {{colors.on_primary_container.default.hex}}

color5                {{colors.tertiary_fixed_dim.default.hex}}
color13               {{colors.tertiary.default.hex}}

color6                {{colors.primary_fixed_dim.default.hex}}
color14               {{colors.primary.default.hex}}

color7                {{colors.on_surface_variant.default.hex}}
color15               {{colors.on_background.default.hex}}
